name: Build and Push Docker Image

on:
    push:
        branches:
            - main
        paths-ignore:
            - "README.md"
            - "DESIGN.md"
            - "k8s.scoped-skin.yaml"
            - "LICENSE"
            - "justfile"
            - "docs/**"
            - ".gitignore"
    workflow_dispatch:

jobs:
    test-go:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            # go:embed all:frontend/dist 要求编译期磁盘上就有可嵌入的文件
            - name: Stub frontend/dist
              run: mkdir -p frontend/dist && touch frontend/dist/STUB

            - name: go vet
              run: go vet ./...

            - name: go test
              run: go test ./... -count=1

    test-frontend:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 12

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "26.x"
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install
              run: cd frontend && pnpm install --frozen-lockfile

            # 类型检查同时守着文案表：t() 的参数类型就是 catalog 的键，漏配 / 键名写错都过不去
            - name: Type check
              run: cd frontend && pnpm typecheck

    build-and-push:
        needs: [test-go, test-frontend]
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # 多架构构建时，amd64 runner 上要用 QEMU 跑 arm64 的运行时阶段（apk add）。
            # 但构建阶段本身在 $BUILDPLATFORM 上跑，不经过模拟。
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            # 登录到 GHCR
            - name: Log in to GitHub Container Registry (GHCR)
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 登录到阿里云 ACR
            - name: Log in to ACR
              uses: docker/login-action@v4
              with:
                  registry: ${{ secrets.ALIYUN_REGISTRY }}
                  username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                  password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            # 获取当前日期 (yyyy-MM-dd) 并强制用户名小写
            - name: Prepare Image Tags
              id: prep
              run: |
                  OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  DATE=$(date +'%Y-%m-%d')
                  echo "owner=$OWNER" >> $GITHUB_OUTPUT
                  echo "date=$DATE" >> $GITHUB_OUTPUT

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  provenance: false
                  # amd64 + arm64 双架构：构建阶段在 $BUILDPLATFORM 上交叉编译，
                  # 只有运行时阶段的 apk add 走 QEMU
                  platforms: linux/amd64,linux/arm64
                  # 同时打上 latest 和 日期 tag
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/scoped-skin:${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/scoped-skin:latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/scoped-skin:${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/scoped-skin:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
