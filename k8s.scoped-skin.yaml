---
apiVersion: v1
kind: ConfigMap
metadata:
    name: env
data:
    DATA_DIR: "/data"
    TZ: "Asia/Shanghai"
    HOST: "0.0.0.0"
    PORT: "8080"
    READYZ_TOKEN: "your_readyz_token"
    TRUSTED_PROXIES: "127.0.0.1/32,::1/128,10.89.2.0/24"
    MAX_API_CONCURRENCY: 128
    MAX_STATIC_CONCURRENCY: 64
    GOMEMLIMIT: "128MiB"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: scoped-skin-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
    name: scoped-skin
    labels:
        app: scoped-skin
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30

    containers:
        - name: app
          image: ghcr.io/hm-service/scoped-skin:latest
          imagePullPolicy: Always

          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                  drop:
                      - ALL

          envFrom:
              - configMapRef:
                    name: env
          ports:
              - name: http
                containerPort: 8080
                protocol: TCP

          resources:
              requests:
                  memory: 64Mi
              limits:
                  memory: 256Mi

          livenessProbe:
              httpGet:
                  path: /livez
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readinessProbe:
              httpGet:
                  path: /readyz?token=your_readyz_token
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          volumeMounts:
              - name: data
                mountPath: /data
    volumes:
        - name: data
          persistentVolumeClaim:
              claimName: scoped-skin-data
