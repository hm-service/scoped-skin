# 反向代理样例：把 scoped-skin 挂到公网
#
# 应用自身只跑 HTTP（DESIGN.md 1.4），TLS、限流、安全头之外的传输细节都在这里兜。
# 用之前改三处：server_name、证书路径、上游地址。

# 若前面还有一层本机代理，用它写进 X-Real-IP 的地址还原真实客户端。
# 注意下面转发时 X-Forwarded-For 是**追加**（$proxy_add_x_forwarded_for），不是覆盖：
# 客户端自己塞的前缀伪造不了 —— 应用自右往左跳过可信网段，取第一个不可信地址（DESIGN.md 5.5）。
set_real_ip_from 127.0.0.1;
real_ip_header   X-Real-IP;

# 应用不做限流（DESIGN.md 5.2，只保证同时在处理的请求 ≤ 128），频率上限都在这里：
# 站点登录 5r/m；上传与 Yggdrasil authenticate 按 DESIGN.md 5.2 的建议给 30r/m。
limit_req_zone  $binary_remote_addr zone=login:10m  rate=5r/m;
limit_req_zone  $binary_remote_addr zone=auth:10m   rate=30r/m;
limit_req_zone  $binary_remote_addr zone=upload:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 443 ssl;
    # HTTP/2 按 nginx 版本二选一：1.25.1+ 用 `http2 on;`，更老的写 `listen 443 ssl http2;`
    server_name skin.example.com;

    ssl_certificate     /etc/letsencrypt/live/skin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skin.example.com/privkey.pem;

    # 贴图上限 32 KiB（base64 预检后约 44 KiB）；应用侧通用请求体上限 1 MiB
    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 应用已经带了 nosniff / no-referrer / X-Frame-Options，这里再写一遍是为了
    # 让反代自己产生的响应（413、502 之类）也有同样的头
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # 【必须】放在 server 层，让所有 location 继承：
    # 覆盖客户端传来的 Host 与 X-Forwarded-Proto —— Yggdrasil 的材质 URL 是拿它们
    # 拼的，不覆盖就等于让请求方决定签名里的域名。
    # 注意别用 Debian 的 include proxy_params;（它是 Host $http_host，即原样透传）。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 75s;
    # 默认开启：慢速请求体先由 nginx 收完，不会挂在应用进程上
    proxy_request_buffering on;

    location = /api/auth/login {
        limit_req zone=login burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/yggdrasil/authserver/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/skins {
        limit_req zone=upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # 探针只给本机与运维网段看。也可以改成给应用设 READYZ_TOKEN，然后任何位置的监控
    # 都能用 /readyz?token=... 访问，不必再按来源 IP 限制。
    location = /livez  { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8080; }
    location = /readyz { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8080; }

    # 贴图是不可变内容（URL 就是内容哈希），要上 CDN 或 nginx 缓存的话这一条最合适；
    # 反过来说 /api/yggdrasil/... 那些响应里带绝对 URL，别开缓存。
    location /asset/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_conn conn 20;
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 80;
    server_name skin.example.com;
    return 301 https://$host$request_uri;
}
